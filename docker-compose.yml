# Local automation stack: n8n (+ Postgres for its own data) and Mailpit as a
# catch-all SMTP inbox. Convex and Next.js run on the host.
#
#   cp n8n/.env.example n8n/.env   # then fill in the secrets
#   pnpm stack:up                   # = docker compose --env-file n8n/.env up -d
#
# Variables come from n8n/.env rather than a root .env so Next.js never loads
# the n8n secrets into its own environment.
#
# n8n editor: http://localhost:5678   Mailpit inbox: http://localhost:8025
name: lendloop

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in n8n/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in n8n/.env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in n8n/.env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      # Workflows read their shared secrets with {{ $env.X }}; n8n 2.x blocks
      # this by default. The exported JSON holds only the expression, never a value.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # The signature Code nodes need node:crypto.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      CONVEX_HTTP_URL: ${CONVEX_HTTP_URL:-http://host.docker.internal:3211}
      CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:?set in n8n/.env}
      N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET:?set in n8n/.env}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-admin@lendloop.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336" # hours (14 days)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
      - ./n8n/credentials:/credentials
    # Lets n8n reach the Convex local backend on the host (needed on Linux;
    # Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web inbox
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  n8n_data:
